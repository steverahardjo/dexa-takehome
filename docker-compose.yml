name: absences

# Shared environment for all backend containers.
x-backend-env: &backend-env
  NODE_ENV: production
  TZ: Asia/Jakarta
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: absences
  DB_USERNAME: attendance
  DB_PASSWORD: ${DB_PASSWORD:-attend1234}
  DB_SYNCHRONIZE: "true"

# Token signing. Auth signs, the gateway verifies; both need the same secret.
x-auth-env: &auth-env
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me}
  JWT_ACCESS_TTL_SECONDS: "900"
  OTP_HASH_SECRET: ${OTP_HASH_SECRET:-dev-only-otp-secret}
  OTP_EXPIRY_SECONDS: "300"
  # Email delivery is disabled: the auth service returns the code in the OTP
  # response. EMAIL_PROVIDER / RESEND_API_KEY / EMAIL_FROM are not read by any
  # running service; `npm run email:smoke` can still use them from the root
  # .env if delivery is turned back on.

# Object storage access, shared by the storage service only. RustFS speaks S3
# and the backend talks to it through the MinIO client, so the variable names
# keep the MINIO_ prefix.
x-storage-env: &storage-env
  # Internal endpoint: only the storage container talks to this name.
  MINIO_ENDPOINT: rustfs
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  # Must match RUSTFS_REGION below: the client signs the region into the SigV4
  # scope, and RustFS falls back to us-east-1 when the variable is unset.
  MINIO_REGION: us-east-1
  MINIO_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-absencesrustfs}
  MINIO_SECRET_KEY: ${RUSTFS_SECRET_KEY:-7689b2602111aaae666f8f9fb7168418133ae9f295426cefe3e6336fda23b62a}
  MINIO_BUCKET: ${RUSTFS_BUCKET:-absences}
  # A presigned URL is signed over the host it will be fetched from, and a
  # browser cannot resolve the compose service name "rustfs". Sign for the
  # published S3 port instead; point these at the public host/port in
  # production (the signature breaks if the two disagree).
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
  MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
  MINIO_UPLOAD_URL_TTL: "600"
  MINIO_DOWNLOAD_URL_TTL: "900"
  # A phone photo after downscaling; the browser never uploads more than this.
  MINIO_MAX_UPLOAD_BYTES: "10485760"

services:

  # --------------------------------------------------
  # MySQL database
  # --------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_password}
      MYSQL_DATABASE: absences
      MYSQL_USER: attendance
      MYSQL_PASSWORD: ${DB_PASSWORD:-attend1234}
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-secure_root_password}
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------
  # RustFS object storage (S3-compatible, Apache-2.0)
  #
  # Credentials come from the environment, so there is no cluster layout or key
  # import step: the server is ready to sign requests as soon as it is healthy,
  # and the storage service creates its private bucket on boot.
  # --------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Jakarta
      # The image defaults to /data; one directory is enough for a single node.
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # Must match MINIO_REGION in x-storage-env, otherwise the SigV4 scope and
      # the server disagree.
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-absencesrustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-7689b2602111aaae666f8f9fb7168418133ae9f295426cefe3e6336fda23b62a}
      # RustFS enforces CORS at the listener, not per bucket: the browser PUTs
      # straight to the presigned URL from the frontend origin.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "9000:9000" # S3 API (backend + presigned browser uploads)
      - "9001:9001" # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      # The container ships curl; /health answers 200 once the S3 listener is up.
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # --------------------------------------------------
  # One-shot: hand the data volume to the RustFS user.
  #
  # RustFS runs as uid 10001 and a fresh named volume is root-owned, so the
  # server would fail to write. Idempotent; re-runs on every `up`.
  # --------------------------------------------------
  rustfs_perms:
    image: alpine:3.20
    restart: "no"
    user: root
    command: ["chown", "-R", "10001:10001", "/data"]
    volumes:
      - rustfs-data:/data

  # --------------------------------------------------
  # Storage service (internal TCP only)
  # --------------------------------------------------
  storage:
    build: ./backend
    command: node dist/apps/storage/main.js
    restart: unless-stopped
    environment:
      <<: [*backend-env, *storage-env]
      STORAGE_TCP_HOST: 0.0.0.0
      STORAGE_TCP_PORT: "4001"
    expose:
      - "4001"
    depends_on:
      # The bucket is created by onModuleInit, which retries until the S3
      # listener answers; waiting for health keeps that retry window short.
      rustfs:
        condition: service_healthy

  # --------------------------------------------------
  # Auth service (internal TCP only)
  # --------------------------------------------------
  auth:
    build: ./backend
    command: node dist/apps/auth/main.js
    restart: unless-stopped
    environment:
      <<: [*backend-env, *auth-env]
      AUTH_TCP_HOST: 0.0.0.0
      AUTH_TCP_PORT: "4002"
    expose:
      - "4002"
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------
  # Employee service (internal TCP only)
  # --------------------------------------------------
  employee:
    build: ./backend
    command: node dist/apps/employee/main.js
    restart: unless-stopped
    environment:
      <<: [*backend-env, *auth-env]
      EMPLOYEE_TCP_HOST: 0.0.0.0
      EMPLOYEE_TCP_PORT: "4003"
      AUTH_TCP_HOST: auth
      AUTH_TCP_PORT: "4002"
      STORAGE_TCP_HOST: storage
      STORAGE_TCP_PORT: "4001"
    expose:
      - "4003"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      storage:
        condition: service_started

  # --------------------------------------------------
  # Attendance service (internal TCP only)
  # --------------------------------------------------
  attendance:
    build: ./backend
    command: node dist/apps/attendance/main.js
    restart: unless-stopped
    environment:
      <<: *backend-env
      ATTENDANCE_TCP_HOST: 0.0.0.0
      ATTENDANCE_TCP_PORT: "4004"
      EMPLOYEE_TCP_HOST: employee
      EMPLOYEE_TCP_PORT: "4003"
      STORAGE_TCP_HOST: storage
      STORAGE_TCP_PORT: "4001"
      COMPANY_TIMEZONE: ${COMPANY_TIMEZONE:-Asia/Jakarta}
      REQUIRED_CHECK_IN: ${REQUIRED_CHECK_IN:-09:00}
      ATTENDANCE_ABSENT_CRON: ${ATTENDANCE_ABSENT_CRON:-0 15 * * *}
    expose:
      - "4004"
    depends_on:
      db:
        condition: service_healthy
      employee:
        condition: service_started
      storage:
        condition: service_started

  # --------------------------------------------------
  # Gateway (the only public HTTP port)
  # --------------------------------------------------
  gateway:
    build: ./backend
    command: node dist/apps/backend/main.js
    restart: unless-stopped
    environment:
      <<: [*backend-env, *auth-env]
      GATEWAY_HTTP_PORT: "3003"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
      AUTH_TCP_HOST: auth
      AUTH_TCP_PORT: "4002"
      EMPLOYEE_TCP_HOST: employee
      EMPLOYEE_TCP_PORT: "4003"
      ATTENDANCE_TCP_HOST: attendance
      ATTENDANCE_TCP_PORT: "4004"
    ports:
      - "3003:3003"
    depends_on:
      auth:
        condition: service_started
      employee:
        condition: service_started
      attendance:
        condition: service_started

  # --------------------------------------------------
  # Frontend (Next.js dev server, the only other published port)
  #
  # The container runs `next dev` so the source is mounted from the host and
  # reloads on save. The rewrite target is a runtime variable because
  # next.config.ts is evaluated when the dev server boots, not when it is built.
  # Rebuild this service after changing package.json: the dependencies live in
  # the image, not in the bind mount.
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      TZ: Asia/Jakarta
      # Every /api/* call is rewritten to the gateway from inside this
      # container, so the browser never needs to know it exists.
      GATEWAY_URL: http://gateway:3003
      # Prefills the sign-in form; must match the seed's admin address.
      NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
    volumes:
      - ./frontend:/app
      # Keep the image's install and the dev build cache: mounting ./frontend
      # over /app would otherwise replace them with the host's stale copies.
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_started

volumes:
  db-data:
  rustfs-data:
  frontend-node-modules:
  frontend-next:


name: absences

# Shared environment for all backend containers.
x-backend-env: &backend-env
  NODE_ENV: production

  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: absences
  DB_USERNAME: attendance
  DB_PASSWORD: ${DB_PASSWORD:-attend1234}
  DB_SYNCHRONIZE: "true"

  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  OTP_DEV_RETURN: "true"

  # Seed file is the only source of demo people and attendance.
  SEED_DEMO: "false"

  FRONTEND_ORIGIN: http://localhost:3000
  TZ: Asia/Jakarta

  # Email configuration.
  MAIL_FROM: "${MAIL_FROM:-Absence Management <absences@example.com>}"
  RESEND_API_KEY: ${RESEND_API_KEY:-}

  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:

  # --------------------------------------------------
  # MySQL Database
  # --------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_password}
      MYSQL_DATABASE: absences
      MYSQL_USER: attendance
      MYSQL_PASSWORD: ${DB_PASSWORD:-attend1234}
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - --silent
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD:-secure_root_password}
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------
  # MinIO AIStor Object Storage
  # --------------------------------------------------
  aistor:
    image: quay.io/minio/aistor/minio:latest
    container_name: absences-aistor
    restart: unless-stopped
    command:
      - minio
      - server
      - /mnt/data
      - --license
      - /minio.license
    environment:
      MINIO_ROOT_USER: ${AISTOR_ROOT_USER:-absences_admin}
      MINIO_ROOT_PASSWORD: ${AISTOR_ROOT_PASSWORD:?Set AISTOR_ROOT_PASSWORD in .env}
      TZ: Asia/Jakarta
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aistor-data:/mnt/data
      - ./aistor/minio.license:/minio.license:ro

  # --------------------------------------------------
  # One-shot Database Seeder
  # --------------------------------------------------
  seed:
    build: ./backend
    command: node dist/database/seed.js
    restart: "no"
    environment:
      <<: *backend-env
      SEED_FILE: /app/dist/database/seed-data.json
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------
  # Authentication Service
  # --------------------------------------------------
  auth:
    build: ./backend
    command: node dist/services/auth/main.js
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3001
      SERVICE_NAME: auth
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  # --------------------------------------------------
  # Employee Service
  # --------------------------------------------------
  employee:
    build: ./backend
    command: node dist/services/employee/main.js
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3002
      SERVICE_NAME: employee

      # S3 / AIStor configuration
      S3_ENDPOINT: http://aistor:9000
      S3_BUCKET: attendance-photos
      S3_ACCESS_KEY: ${AISTOR_ROOT_USER:-absences_admin}
      S3_SECRET_KEY: ${AISTOR_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      aistor:
        condition: service_started

  # --------------------------------------------------
  # Administration Service
  # --------------------------------------------------
  admin:
    build: ./backend
    command: node dist/services/admin/main.js
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: 3003
      SERVICE_NAME: admin

      S3_ENDPOINT: http://aistor:9000
      S3_BUCKET: attendance-photos
      S3_ACCESS_KEY: ${AISTOR_ROOT_USER:-absences_admin}
      S3_SECRET_KEY: ${AISTOR_ROOT_PASSWORD}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      aistor:
        condition: service_started

volumes:
  db-data:
  aistor-data:
